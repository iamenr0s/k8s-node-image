# Kubernetes state directories. `z` re-applies mode and SELinux label to the
# mount root when the directory is its own filesystem.
d /var/lib/kubelet 0700 root root -
z /var/lib/kubelet 0700 root root -
d /var/lib/etcd 0700 root root -
z /var/lib/etcd 0700 root root -
d /var/lib/etcd-backup 0700 root root -
d /var/log/kubernetes 0750 root root -
d /var/log/kubernetes/audit 0750 root root -
d /var/log/audit 0700 root root -
d /var/lib/k8s-node 0700 root root -
d /var/data 0755 root root -
z /var/data 0755 root root -

# chronyd's unit has ReadWritePaths=/var/lib/chrony (no '-'): systemd refuses to
# start it when the directory is missing, and the base image ships an empty /var.
d /var/lib/chrony 0750 chrony chrony -
d /var/log/chrony 0750 chrony chrony -
