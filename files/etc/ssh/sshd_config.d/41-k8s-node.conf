# Kubernetes node SSH policy, layered on bootc-images' 40-hardening.conf
# (PermitRootLogin no, PasswordAuthentication no, KbdInteractiveAuthentication no,
# PubkeyAuthentication yes). sshd keeps the FIRST value it reads for a keyword,
# and this file sorts before 50-redhat.conf and 50-cloud-init.conf, so it wins.
AuthenticationMethods publickey
PermitEmptyPasswords no
PermitUserEnvironment no
AllowGroups wheel
MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:60
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GSSAPIAuthentication no
HostbasedAuthentication no
IgnoreRhosts yes
UseDNS no
LogLevel VERBOSE
# Keys: per-user file in the home dir (provisioned at install/first boot), plus an
# optional image-owned, read-only location (Method A in the guide).
AuthorizedKeysFile .ssh/authorized_keys /usr/share/ssh/authorized_keys.d/%u
# SSH certificates (recommended): trust a user CA shipped in the image.
# Uncomment once files/usr/share/ssh/user-ca.pub exists.
#TrustedUserCAKeys /usr/share/ssh/user-ca.pub
#AuthorizedPrincipalsFile /usr/share/ssh/auth_principals/%u
