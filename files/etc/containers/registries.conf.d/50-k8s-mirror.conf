# Pull-through mirrors for cluster images (CRI-O and podman read this).
[[registry]]
prefix = "registry.k8s.io"
location = "registry.k8s.io"
[[registry.mirror]]
location = "registry.example.internal/mirror/registry.k8s.io"

[[registry]]
prefix = "quay.io"
location = "quay.io"
[[registry.mirror]]
location = "registry.example.internal/mirror/quay.io"
