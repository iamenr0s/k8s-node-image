# First boot: write authorized_keys from the systemd credential
# "ssh.authorized_keys.k8sadmin" (SMBIOS type 11, fw_cfg, or kernel cmdline).
# 'f^' creates the file only if absent, so later edits are kept.
d /var/home/k8sadmin 0700 k8sadmin k8sadmin -
d /var/home/k8sadmin/.ssh 0700 k8sadmin k8sadmin -
f^ /var/home/k8sadmin/.ssh/authorized_keys 0600 k8sadmin k8sadmin - ssh.authorized_keys.k8sadmin
